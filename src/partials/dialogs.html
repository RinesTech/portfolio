<dialog id="modal" aria-labelledby="m-title">
<button class="x" type="button" aria-label="Close">&times;</button>
<div class="thumb big" id="m-img"></div><p class="mono dim tag" id="m-cat"></p><h3 id="m-title"></h3><p id="m-note" class="muted"></p>
<div id="m-stack" class="chips mono"></div><div id="m-links" class="actions"></div>
</dialog>

<dialog id="preview" aria-label="Preview">
<button class="x" type="button" aria-label="Close">&times;</button>
<h3 id="pv-title" class="mono"></h3>
<button class="btn ghost sm" type="button" id="pv-back" hidden>&larr; All designs</button>
<div class="stage" id="pv-stage"></div>
<p id="pv-caption" class="mono"></p>
<div class="pv-nav mono" id="pv-nav" hidden><button class="btn ghost sm" type="button" id="pv-prev">&larr; Prev</button><span id="pv-count"></span><button class="btn ghost sm" type="button" id="pv-next">Next &rarr;</button></div>
</dialog>
