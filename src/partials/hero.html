<section id="home" class="wrap hero">
<span class="pill mono"><i></i>{{site.role}}</span>
<h1 class="mono">{{site.name}}<span class="caret"></span></h1>
<p class="sub mono">{{site.role}}</p>
<p class="lead">{{site.intro}}</p>
<p class="mono typed-line dim">Building <span id="typed" data-words="{{@typedWords}}">{{site.typedFirst}}</span></p>
<div class="actions"><a class="btn solid" href="#projects">View Projects {{@icon.down}}</a>
<a class="btn ghost" href="{{site.github}}" target="_blank" rel="noopener">{{@icon.gh}} GitHub</a></div>
<ul class="stats mono"><li><b data-count="{{stat.projects}}">0</b>projects</li><li><b data-count="{{stat.years}}">0</b>years on SA-MP</li><li><b data-count="{{stat.real}}">0</b>used by real people</li></ul>
</section>
